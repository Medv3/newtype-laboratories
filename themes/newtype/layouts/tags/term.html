{{ define "main" }}
<section class="nt-list">
    <header class="nt-list-header">
        <div class="nt-list-titlewrap">
            <div class="nt-post-subject">//NODE_SEARCH:</div>
            <h1 class="nt-section-title">{{ .Title }}</h1>
        </div>
        <div class="nt-list-stats">
            NODE_PATH: /VAR/TAGS/{{ .Title | upper }}<br>
            FILES_FOUND: {{ len .Pages }}
        </div>
    </header>

    <hr class="nt-rule">

    <ol class="nt-posts-list">
        {{ range .Pages }}
        <li class="nt-post-item">
            <a href="{{ .Permalink }}">
                <span class="nt-post-index">[{{ .Date.Format "2006-01-02" }}]</span>
                <span class="nt-post-name">{{ .Title }}</span>
                <span class="nt-post-readtime">{{ .ReadingTime }} min</span>
            </a>
        </li>
        {{ end }}
    </ol>

    <div class="nt-return">
        <a href="/tags/">[ ← RETURN_TO_INDEX ]</a>
    </div>
</section>
{{ end }}
