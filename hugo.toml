baseURL = "https://newtypelabs.netlify.app/"
locale = "es-ES"
title = "Newtype Laboratories"
theme = "newtype"

# --- Paginación ---
[pagination]
  pagerSize = 10
  path = "page"

# --- Taxonomías ---
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# --- Menú principal ---
[[menu.main]]
  name = "Inicio"
  url = "/"
  weight = 10

[[menu.main]]
  name = "Publicaciones"
  url = "/posts/"
  weight = 20

[[menu.main]]
  name = "Sobre mí"
  url = "/about/"
  weight = 30

# --- Parámetros del tema ---

[privacy]
  [privacy.youtube]
    disable = false
    privacyEnhanced = true


[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = false
    noClasses = false

[params]
  default_og_image = "/img/og-default.jpg"
  author = "FL0RES.sys"
  operator_alias = "FL0RES.sys"
  email = "newtypelabs@tuta.io"
  github = "Medv3/newtype-laboratories"
  tagline = "Un laboratorio para la producción de otros futuros posibles."
  description = "Escritos sobre tecnología, capital y poder."
