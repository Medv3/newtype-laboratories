[build]
  publish = "public"
  command = "hugo --minify --gc"

[build.environment]
  HUGO_VERSION = "0.162.1"
  HUGO_ENV = "production"

# Headers de seguridad (bonus)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache de fuentes (1 año)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache de imágenes (1 mes)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Cabeceras de seguridad para todas las rutas
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: Fuerza HTTPS por 1 año, incluyendo subdominios
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # CSP: Permite solo recursos del propio sitio (self). 
    # 'unsafe-inline' para estilos es necesario por el CSS crítico o estilos en línea que usa el tema.
    # No se permiten scripts externos, iframes, ni conexiones a terceros.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
    
    # Evitar que el sitio sea embebido en un iframe (Clickjacking)
    X-Frame-Options = "DENY"
    
    # Evitar que el navegador adivine el tipo de contenido (MIME sniffing)
    X-Content-Type-Options = "nosniff"
    
    # Política de referencia estricta
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Deshabilitar APIs sensibles (geolocalización, cámara, micrófono)
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Eliminar cabeceras que revelan información del servidor
[[headers]]
  for = "/*"
  [headers.values]
    Server = ""
    X-Powered-By = ""
